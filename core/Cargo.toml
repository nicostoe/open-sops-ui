[package]
name = "open-sops-ui-core"
version = "1.1.0"
edition = "2021"
description = "Backend logic for open-sops-ui: keys, SOPS files and calls to the sops CLI"
license = "MIT"

[dependencies]
age = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
