<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open SOPS UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="title"><span data-ic="lock"></span>Open SOPS UI</span>
  <button class="btn ghost folder mono" id="folderBtn" title="Change folder"></button>
  <span class="spacer"></span>
  <button class="btn ghost" id="keysBtn"><span data-ic="key"></span>Keys<span id="keysDot"></span></button>
  <button class="btn ghost" id="recBtn"><span data-ic="users"></span>Recipients</button>
  <button class="btn icon update" id="updateBtn" hidden></button>
  <button class="btn icon" id="settingsBtn" title="Settings" aria-label="Settings"></button>
</header>
<div id="banner"></div>
<main>
  <aside class="scanning">
    <div class="scanbar" aria-hidden="true"></div>
    <div class="sidehead"><span class="muted small">Files</span>
      <button class="btn icon" id="refreshBtn" title="Refresh: look for new and changed files" aria-label="Refresh"></button></div>
    <div id="files"><div class="muted small scanhint">Looking for SOPS files…</div></div>
  </aside>
  <div id="resizer" role="separator" aria-orientation="vertical" aria-label="File list width" tabindex="0"
    title="Drag to resize, double-click to reset"></div>
  <section id="editor"></section>
</main>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="toast" role="status"></div>

<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
