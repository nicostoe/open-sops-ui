name: Release

# Pushing a tag like v0.2.0 publishes a release with packages for every
# platform. A tag with a suffix, like v0.2.0-beta.1, publishes a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Package file names carry the version from tauri.conf.json, so a tag
      # that disagrees would publish mislabelled files.
      - name: Tag must match src-tauri/tauri.conf.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          configured="$(jq -r .version src-tauri/tauri.conf.json)"
          tagged="${TAG#v}"; tagged="${tagged%%-*}"
          if [ "$configured" != "$tagged" ]; then
            echo "::error::Tag $TAG doesn't match version $configured in src-tauri/tauri.conf.json. Update the file, then tag again."
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          # A suffix after the version (v1.2.3-beta.1) marks a pre-release.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
