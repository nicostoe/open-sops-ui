name: Release

# Publishes a release with packages for every platform, in one of two ways:
#
# - From the Actions tab: "Release" → "Run workflow" on main, choosing beta or
#   stable. Versions come from the tags alone (scripts/next-release.sh): a
#   beta releases the current main as the next v<version>-beta.N, where the
#   bump (patch, minor, major) picks the version after the latest stable
#   release; stable promotes the commit of the latest beta, and needs one.
#   The app is built and tested at that commit with the release's version,
#   and only then is the tag created and the release published, so a failed
#   build leaves no tag. Nothing is released unless someone starts it: pull
#   requests and pushes to main only build.
# - By pushing a tag like v0.2.0. A tag with a suffix, like v0.2.0-beta.1,
#   publishes a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "beta: main as the next pre-release. stable: promote the latest beta."
        type: choice
        options: [beta, stable]
        default: beta
      bump:
        description: "For a beta: what comes after the latest stable release (1.1.0 → patch 1.1.1, minor 1.2.0, major 2.0.0). Betas already further along carry on."
        type: choice
        options: [patch, minor, major]
        default: patch
      intro:
        description: "Optional introduction at the top of the release notes"
        type: string
        default: ""

permissions:
  contents: read

# One release at a time, so two runs can't pick the same beta number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CLIFF_VERSION: 2.14.2 # renovate: datasource=crate depName=git-cliff

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, to find the next beta number

      - name: Work out the tag
        id: tag
        env:
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are made from main. Run the workflow on main."
              exit 1
            fi
            next="$(scripts/next-release.sh "$CHANNEL" "$BUMP")"
            read -r tag commit <<<"$next"
          else
            tag="$GITHUB_REF_NAME"
            commit="$GITHUB_SHA"
          fi
          echo "Releasing $tag from $commit"
          { echo "tag=$tag"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          echo "### Releasing $tag from \`${commit:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      # The packages take their version from the tag (scripts/version.sh),
      # so it has to be one.
      - name: The tag must be a version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG isn't a version tag like v1.2.0 or v1.2.0-beta.1."
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      # For a pushed tag the build reads it from the ref; a release from the
      # Actions tab has no tag yet and passes it on.
      tag: ${{ github.event_name == 'workflow_dispatch' && needs.version.outputs.tag || '' }}
      ref: ${{ needs.version.outputs.commit }}

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      # The full history and all tags, to find the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only now, with every platform built and tested: an annotated tag on
      # the commit that was built, with the person who started the run as
      # tagger. Pushed with the workflow's token, so it doesn't start this
      # workflow a second time.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INTRO: ${{ inputs.intro }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          if [ -n "$INTRO" ]; then
            git tag -a "$TAG" "$COMMIT" -m "$TAG" -m "$INTRO"
          else
            git tag -a "$TAG" "$COMMIT" -m "$TAG"
          fi
          git push origin "refs/tags/$TAG"

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@${{ env.GIT_CLIFF_VERSION }}

      # What changed since the previous release, grouped into features, bug
      # fixes, security and dependencies (cliff.toml).
      - name: Write the release notes
        # checkout can leave a pushed tag as a lightweight one; fetching it
        # again restores the annotated tag, whose message opens the notes.
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md" && cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          # A suffix after the version (v1.2.3-beta.1) marks a pre-release.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
