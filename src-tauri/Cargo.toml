[package]
name = "open-sops-ui"
version = "0.1.0"
edition = "2021"
description = "Desktop UI for SOPS-encrypted env files"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
open-sops-ui-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
